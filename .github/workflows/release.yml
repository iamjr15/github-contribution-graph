name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -w packages/github-contribution-graph

      - name: Build
        run: npm run build

      # OIDC trusted publishing: no NODE_AUTH_TOKEN env (a static token would
      # preempt OIDC). id-token: write + npm >= 11.5.1 (Node 24) mint a
      # short-lived credential. Provenance is automatic; --provenance explicit.
      - name: Publish to npm
        run: npm publish -w packages/github-contribution-graph --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
